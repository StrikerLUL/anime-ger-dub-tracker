name: 🎬 Daten aktualisieren

on:
  # Täglich um 06:00 UTC (07:00 Berlin im Winter, 08:00 im Sommer)
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      quellen:
        description: 'Welche Quellen? (Komma-getrennt, z. B. anisearch,anilist)'
        required: false
        default: 'anisearch,anilist,jikan,news'

# Zwei gleichzeitig laufende Läufe würden sich beim Push gegenseitig überholen.
concurrency:
  group: anime-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Quellen abfragen & veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      PYTHONIOENCODING: utf-8
      TRACKER_SOURCES: ${{ inputs.quellen || 'anisearch,anilist,jikan,news' }}
      # Aufbewahrung – hier zentral einstellbar, ohne Code anzufassen.
      TRACKER_MAX_AGE_DAYS: '365'
      TRACKER_STALE_GRACE_DAYS: '14'
      TRACKER_MAX_ENTRIES: '400'

    steps:
      - name: 📥 Repository holen
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements_actions.txt'

      - name: 📦 Abhängigkeiten installieren
        run: |
          pip install -r requirements_actions.txt
          python -m playwright install --with-deps chromium

      # Die Datenlogik (Entdoppeln, Aufbewahrung, Hashing) läuft ohne Netzwerk
      # und dauert Sekunden – deshalb vor dem Scraping, damit ein Logikfehler
      # nicht erst nach 20 Minuten auffällt.
      - name: 🧪 Datenlogik testen
        run: python -m pytest -m "not ui"

      - name: 🔍 Quellen abfragen
        run: python -m tracker scrape

      # Letzte Station vor der Veröffentlichung: Duplikate, Pflichtfelder,
      # Aufbewahrungsregeln, Hash und Zählerstände.
      - name: ✅ Daten prüfen
        run: python -m tracker check

      - name: 📋 Zusammenfassung
        if: always()
        run: |
          {
            echo '## 🎬 Anime Ger Dub Tracker'
            echo '```'
            python -m tracker info || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 anime_data.json committen
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add anime_data.json
          # Die Pipeline schreibt die Datei nur bei echten Änderungen neu:
          # gleiche Daten → kein Diff → kein Commit → keine wachsende Historie.
          if git diff --staged --quiet; then
            echo "ℹ️  Keine Datenänderung – nichts zu committen"
          else
            git commit -m "🤖 Auto-Update: Anime-Dub-Daten $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "✅ anime_data.json gepusht"
          fi

      # Optional: Upload auf den Webspace (meine-anime-welt.de).
      # Läuft auch ohne neuen Commit – so liegt dort immer die aktuelle Datei.
      - name: 🌐 FTP-Upload (optional)
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH || '/htdocs/' }}
          include: |
            anime_data.json
          exclude: |
            **
            !anime_data.json
