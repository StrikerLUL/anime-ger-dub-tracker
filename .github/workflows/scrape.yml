name: 🎬 Anime Dub Scraper

on:
  # Täglich um 06:00 UTC (= 07:00 Uhr Europa/Berlin Winterzeit, 08:00 Sommerzeit)
  schedule:
    - cron: '0 6 * * *'
  # Manueller Start über den GitHub-Actions-Tab
  workflow_dispatch:

# Parallel laufende Scraper würden sich beim Push gegenseitig überholen.
concurrency:
  group: anime-scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape anisearch.de & Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write   # Für git commit + push

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements_actions.txt'

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements_actions.txt
          python -m playwright install --with-deps chromium

      # Prüft die Datenlogik (Deduplizierung, Hashing) ohne Netzwerkzugriff.
      # Läuft vor dem Scraping, damit ein Logikfehler nicht erst nach 20 Minuten auffällt.
      - name: 🧪 Datenlogik testen
        run: python -m pytest test_data_pipeline.py -q

      - name: 🔍 Run Anisearch Scraper
        run: python scraper_standalone.py
        env:
          PYTHONIOENCODING: utf-8

      # Fachliche Prüfung: Datei vorhanden, Daten da – und vor allem:
      # kein Anime steht in mehr als einer Kategorie.
      - name: ✅ Daten prüfen (inkl. Duplikat-Check)
        run: python check_data.py

      - name: 💾 Commit & Push anime_data.json
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add anime_data.json
          # Der Scraper schreibt die Datei nur bei echten Datenänderungen neu.
          # Gleiche Daten → kein Diff → kein Commit → keine endlos wachsende Historie.
          if git diff --staged --quiet; then
            echo "ℹ️  Keine Datenänderung – nichts zu committen"
          else
            git commit -m "🤖 Auto-Update: Anime Dub Daten $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "✅ anime_data.json erfolgreich gepusht!"
          fi

      # Optional: FTP-Upload zu InfinityFree (meine-anime-welt.de).
      # Läuft auch dann, wenn es keinen neuen Commit gab – so liegt auf dem
      # Webspace garantiert immer die aktuelle Datei.
      - name: 🌐 FTP Upload to InfinityFree (optional)
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # Nur anime_data.json hochladen (nicht den ganzen Repo-Inhalt)
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH || '/htdocs/' }}
          include: |
            anime_data.json
          exclude: |
            **
            !anime_data.json
